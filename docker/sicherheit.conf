# Sicherheitsköpfe an einer Stelle (BF-5). nginx bindet sie auf Serverebene und in jedem Ort mit eigenem add_header ein
# (ein add_header im Ort hebt die des Servers auf); die Probe und vite lesen dieselbe Datei.
#
# Bücher sind fremder Inhalt: foliate-js zeigt EPUB-Kapitel als blob:-Rahmen mit sandbox="allow-same-origin allow-scripts"
# (WebKit braucht allow-scripts, siehe README von foliate-js). Diese Rahmen erben die Richtlinie der App; nur so läuft kein
# Skript aus einem Buch und nichts liest den Schlüssel aus localStorage. Darum:
#   script-src  nur die gebaute App ('self'), kein Inline-Skript, kein eval; WebAssembly für Prüfsummen (hash-wasm)
#   style-src   Inline-Stil für Svelte, CodeMirror, Mermaid und die Kapitel der Bücher, blob: für deren Stilblätter
#   img-src, font-src, media-src  die App und /api, dazu data: und blob: (Bilder, Schriften und Ton aus Büchern,
#               Stille zum Freigeben des Tons); nichts von fremden Adressen, auch kein Zählpixel aus einem Buch
#   connect-src die App und /api, blob: für Inhalte, die schon im Browser liegen
#   frame-src   nur blob: (Kapitel), worker-src nur die App (pdf.js, Service Worker)
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' blob:; frame-src blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
